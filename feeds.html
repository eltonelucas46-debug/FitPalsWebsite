<script type="module">

// ================= FIREBASE IMPORTS =================


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";



import {

getAuth,

onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";



import {

getFirestore,
doc,
getDoc,
collection,
addDoc,
query,
orderBy,
getDocs,
updateDoc,
serverTimestamp,
where,
limit,
onSnapshot,
setDoc,
writeBatch,
deleteDoc,
increment

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





// ================= FIREBASE CONFIG =================


const firebaseConfig = {


apiKey:"AIzaSyCFvIIEugiK4QcEoX6BjpNCDMR_Dr2_ZbU",

authDomain:"fitpals-booking-system-9e029.firebaseapp.com",

projectId:"fitpals-booking-system-9e029",

storageBucket:"fitpals-booking-system-9e029.firebasestorage.app",

messagingSenderId:"970079191247",

appId:"1:970079191247:web:18aeeb996421e05ae5b7ba"


};




// ================= INITIALIZE =================


const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);




// ================= CLOUDINARY SETTINGS =================


const CLOUD_NAME = "wj9w0u7q";


const UPLOAD_PRESET = "fitpals_profile";





// ================= DEFAULT IMAGE =================


const defaultPhoto =

"https://cdn-icons-png.flaticon.com/512/149/149071.png";





// ================= CURRENT USER DATA =================


let currentUser = null;
let currentChatID = null;
let unsubscribeMessages = null;

let currentUserData = {};





// ================= CHECK LOGIN =================



onAuthStateChanged(auth, async(user)=>{


if(!user){


showToast("Please login to access FitPals Community");


window.location.href="account.html";


return;


}



currentUser = user;




try{


const userRef = doc(

db,

"users",

user.uid

);



const userSnap = await getDoc(userRef);




if(userSnap.exists()){


currentUserData = userSnap.data();



document.getElementById("headerName")
.textContent =

currentUserData.name || "Member";





if(currentUserData.photoURL){



document.getElementById("headerPhoto")
.src =

currentUserData.photoURL;



}

else{


document.getElementById("headerPhoto")
.src = defaultPhoto;


}



}

else{


document.getElementById("headerName")
.textContent="Member";


}




// Start loading posts

loadPosts();
listenNotificationBadge();



}

catch(error){


console.log(error);


}


});





// ================= CLOUDINARY UPLOAD FUNCTION =================



async function uploadToCloudinary(file){



const formData = new FormData();



formData.append(

"file",

file

);



formData.append(

"upload_preset",

UPLOAD_PRESET

);





const response = await fetch(


`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,


{


method:"POST",

body:formData


}



);



const data = await response.json();




return data.secure_url;



}



// ================= MODAL CONTROLS =================



window.openTextPost = function () {
    document.getElementById("textModal").classList.add("show");
};

window.closeTextPost = function () {
    document.getElementById("textModal").classList.remove("show");
};

window.openPhotoPost = function () {
    document.getElementById("photoModal").classList.add("show");
};

window.closePhotoPost = function () {
    document.getElementById("photoModal").classList.remove("show");
};


window.closeComments = function(){

    document.getElementById("commentModal").classList.remove("show");
};





// ================= IMAGE PREVIEW =================



document.getElementById("photoInput")
.addEventListener("change",function(){


const file=this.files[0];


if(file){


const reader=new FileReader();


reader.onload=function(e){


const img=document.getElementById("previewImage");


img.src=e.target.result;


img.style.display="block";


}


reader.readAsDataURL(file);


}



});
  
// ================= CREATE TEXT POST =================


document.getElementById("textPostBtn").addEventListener("click", async () => {

    const text = document.getElementById("textContent").value.trim();

    if (!text) {
        showToast("Write something first");
        return;
    }

    if (!currentUser) {
        showToast("You are not logged in");
        return;
    }

    try {

        await addDoc(collection(db, "posts"), {
            uid: currentUser.uid,
            name: currentUserData.name || "FitPals Member",
            photoURL: currentUserData.photoURL || defaultPhoto,
            content: text,
            imageURL: "",
            likes: 0,
            createdAt: serverTimestamp()
        });

        document.getElementById("textContent").value = "";

        closeTextPost();

        showToast("Post published successfully");

        await loadPosts();

    } catch (error) {
        console.error(error);
        showToast(error.message);
    }

});







// ================= CREATE PHOTO POST =================



document.getElementById("photoPostBtn").addEventListener("click", async () => {

    const file = document.getElementById("photoInput").files[0];
    const caption = document.getElementById("photoCaption").value.trim();

    if (!file) {
        showToast("Select a photo");
        return;
    }

    if (!currentUser) {
        showToast("You are not logged in");
        return;
    }

    try {

        document.getElementById("loading").style.display = "block";

        const imageURL = await uploadToCloudinary(file);

        await addDoc(collection(db, "posts"), {
            uid: currentUser.uid,
            name: currentUserData.name || "FitPals Member",
            photoURL: currentUserData.photoURL || defaultPhoto,
            content: caption,
            imageURL,
            likes: 0,
            createdAt: serverTimestamp()
        });

        document.getElementById("loading").style.display = "none";

        document.getElementById("photoInput").value = "";
        document.getElementById("photoCaption").value = "";
        document.getElementById("previewImage").style.display = "none";

        closePhotoPost();

        showToast("Photo posted successfully");

        await loadPosts();

    } catch (error) {

        console.error(error);

        document.getElementById("loading").style.display = "none";

        showToast("Upload failed");

    }

});

// ================= LOAD POSTS =================



async function loadPosts(){



const feed =
document.getElementById("feed");



feed.innerHTML="Loading posts...";



try{


const postsQuery=query(

collection(db,"posts"),

orderBy(

"createdAt",

"desc"

)

);





const snapshot =
await getDocs(postsQuery);




feed.innerHTML="";




for (const postDoc of snapshot.docs) {

const post = postDoc.data();

const id = postDoc.id;

const commentsSnap = await getDocs(
    query(
        collection(db,"comments"),
        where("postId","==",id)
    )

async function loadNotifications() {

    const list = document.getElementById("notificationList");
    list.innerHTML = `
<div style="text-align:center;padding:30px;color:#888;">
<i class="fas fa-spinner fa-spin"></i><br>
Loading notifications...
</div>`;

    try {

        const q = query(
            collection(db, "notifications"),
            where("receiverID", "==", currentUser.uid)
        );

        const snapshot = await getDocs(q);

        list.innerHTML = "";

        if(snapshot.empty){

            list.innerHTML = `
            <div style="text-align:center;color:#888;margin-top:30px;">
            No notifications yet
            </div>`;

            return;
        }


        let notifications = [];

        snapshot.forEach(docSnap=>{
            notifications.push(docSnap.data());
        });


        notifications.sort((a,b)=>{

            if(!a.createdAt) return 1;
            if(!b.createdAt) return -1;

            return b.createdAt.seconds - a.createdAt.seconds;

        });


        notifications.forEach(notif=>{

            list.innerHTML += `

            <div class="notification-card">

                <i class="fas fa-bell"></i>

                <div>

                <p style="color:#ddd;">
                ${notif.text || "New activity on FitPals"}

            `;

        });


    } catch(error){

        console.error(error);

        list.innerHTML="Failed loading notifications";

    }

}

// ================= TIME FUNCTION =================



function timeAgo(timestamp){



if(!timestamp)return "Just now";



const date =
timestamp.toDate();



const seconds =
Math.floor(

(new Date()-date)/1000

);



if(seconds < 60)

return "Just now";



const minutes =
Math.floor(seconds/60);



if(minutes < 60)

return minutes+" mins ago";



const hours =
Math.floor(minutes/60);



if(hours < 24)

return hours+" hrs ago";



const days =
Math.floor(hours/24);



return days+" days ago";


}









// ================= LIKE SYSTEM =================
window.likePost = async function(postId){

    const likeRef = doc(
        db,
        "posts",
        postId,
        "likes",
        currentUser.uid
    );

    const likeSnap = await getDoc(likeRef);

    const postRef = doc(db,"posts",postId);
    const postSnap = await getDoc(postRef);

    if(!postSnap.exists()) return;

    const postData = postSnap.data();

    if(likeSnap.exists()){

        // Unlike
        await deleteDoc(likeRef);

        await updateDoc(postRef,{
            likes:increment(-1)
        });

    }else{

        // Like
        await setDoc(likeRef,{
            uid:currentUser.uid,
            createdAt:serverTimestamp()
        });

        await updateDoc(postRef,{
            likes:increment(1)
        });

        await createNotification(
            postData.uid,
            `${currentUserData.name} liked your post ❤️`
        );

    }

    loadPosts();

}
